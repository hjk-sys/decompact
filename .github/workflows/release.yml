name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1+, and staged publishing a recent npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      # No token: npm authenticates with this workflow's OIDC identity via the trusted
      # publisher configured on npmjs.com, and adds provenance automatically.
      # The release is only staged. It goes live once a maintainer approves it on npmjs.com.
      - run: npm stage publish --access public
